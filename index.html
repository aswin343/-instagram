<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 935px;
            width: 100%;
        }
        
        .login-box {
            width: 100%;
            max-width: 350px;
        }
        
        .login-form {
            background-color: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 1px;
            padding: 40px;
            margin: 20px 0;
            text-align: center;
        }
        
        .logo {
            margin: -20px auto 20px;
        }
        
        .logo-img {
            width: 175px;
            height: 51px;
            background-image: url('https://www.instagram.com/static/images/web/logged_out_wordmark.png/7a252de00b20.png');
            background-size: 175px 51px;
            background-repeat: no-repeat;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-control {
            width: 100%;
            padding: 9px 8px;
            background: #fafafa;
            border: 1px solid #efefef;
            border-radius: 3px;
            font-size: 12px;
            text-align: left;
        }
        
        .form-control:focus {
            border-color: #b2b2b2;
            outline: none;
        }
        
        .btn-login {
            width: 100%;
            background-color: #4cb5f5;
            border: 1px solid #4cb5f5;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            padding: 8px 16px;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .btn-login:hover {
            background-color: #3fa1e0;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
            font-weight: 600;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #efefef;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .facebook-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin-bottom: 20px;
        }
        
        .facebook-login svg {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .forgot-password {
            font-size: 12px;
            margin-top: 20px;
        }
        
        .forgot-password a {
            color: #00376b;
            text-decoration: none;
        }
        
        .signup-box {
            background-color: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 1px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .signup-box p {
            color: #262626;
        }
        
        .signup-link {
            color: #4cb5f5;
            font-weight: 600;
            text-decoration: none;
        }
        
        .get-app {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }
        
        .get-app p {
            margin-bottom: 15px;
            color: #262626;
        }
        
        .app-images {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .app-images img {
            height: 40px;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #8e8e8e;
            font-size: 12px;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }
        
        .footer-link {
            color: #8e8e8e;
            text-decoration: none;
        }
        
        .copyright {
            margin-top: 20px;
        }   
        
        @media (min-width: 876px) {
            .footer-links {
                max-width: 1000px;
                flex-wrap: nowrap;
                flex-wrap: wrap;
            }
        }
        .footer {
    text-align: center;
    margin-top: 60px; /* moves footer down */
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px; /* space between words */
    margin-bottom: 20px;
}

.footer-link {
    color: #8e8e8e;
    font-size: 12px;
    text-decoration: none;
}


    </style>
